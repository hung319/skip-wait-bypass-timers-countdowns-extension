name: Build Extension ZIP

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --include=dev

      - name: Type check
        run: npx tsc --noEmit

      - name: Build & Package ZIP
        run: bash scripts/build-zip.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: skip-wait-extension
          path: build/*.zip
          compression-level: 0
