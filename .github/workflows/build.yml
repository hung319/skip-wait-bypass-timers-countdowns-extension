name: Build Extension ZIP

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --include=dev

      - name: Type check
        run: npx tsc --noEmit

      - name: Build & Package ZIP
        run: bash scripts/build-zip.sh

      - name: Upload to Dev Release
        if: github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          if gh release view "dev" &>/dev/null; then
            gh release upload "dev" build/*.zip --clobber
          else
            gh release create "dev" build/*.zip \
              --title "Dev Build v${VERSION}" \
              --notes "Auto-built from dev branch" \
              --target "${{ github.sha }}"
          fi

      - name: Upload to Release (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          gh release create "v${VERSION}" build/*.zip \
            --title "v${VERSION}" \
            --notes "See [CHANGELOG](https://github.com/${{ github.repository }}/commits/main)" \
            --target "${{ github.sha }}" || true
